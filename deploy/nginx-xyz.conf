# /etc/nginx/sites-available/xyz.com  (symlink into sites-enabled)
# Replace xyz.com with the real domain. Get the certificate with:
#   sudo certbot --nginx -d xyz.com -d www.xyz.com

limit_req_zone $binary_remote_addr zone=shorten:10m rate=10r/m;

server {
    listen 80;
    server_name xyz.com www.xyz.com;
    return 301 https://xyz.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xyz.com www.xyz.com;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/xyz.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/xyz.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    location = /api/shorten {
        limit_req zone=shorten burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    access_log /var/log/nginx/xyz.access.log;
    error_log  /var/log/nginx/xyz.error.log;
}
